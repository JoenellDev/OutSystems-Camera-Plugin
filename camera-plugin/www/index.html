<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camera Plugin Test</title>
</head>

<body>

    <h2>Camera Plugin Test</h2>

    <button id="takePhotoButton" disabled>
        TAKE PHOTO
    </button>

    <p id="result">Waiting for Cordova...</p>

    <script src="cordova.js"></script>

    <script>
        document.addEventListener("deviceready", function () {

            document.getElementById("result").innerText =
                "Cordova ready. Camera plugin ready.";

            document.getElementById("takePhotoButton").disabled = false;

        }, false);


        document.getElementById("takePhotoButton").addEventListener(
            "click",
            function () {

                document.getElementById("result").innerText =
                    "Opening camera...";

                CameraPlugin.takePhoto(
                    function (result) {

                        document.getElementById("result").innerText =
                            "SUCCESS: " + result;

                    },
                    function (error) {

                        document.getElementById("result").innerText =
                            "ERROR: " + error;

                    }
                );

            }
        );
    </script>  

</body>
</html>
